<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteer | Register</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body>
  <div class="auth-wrapper" ng-controller="VolRegisterCtrl">
    <!-- TODO: replace background-color below with background-image: url('../assets/concert.jpg') once you add your own photo -->
    <div class="auth-image" style="background:linear-gradient(160deg,#120a24,#3a1f66);"></div>

    <div class="auth-form-side">
      <div class="auth-box" style="max-width:420px;">
        <h2 style="text-align:left;">Create Your Account</h2>
        <p class="subtitle" style="text-align:left;">Join us as a volunteer!</p>

        <div class="error-msg" ng-if="error">{{error}}</div>

        <form ng-submit="submit()">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" ng-model="data.fullName" placeholder="Enter your full name" />
          </div>
          <div class="form-group">
            <label>Registration Number</label>
            <input type="text" ng-model="data.registerNo" placeholder="Enter Register no." />
          </div>
          <div class="form-group">
            <label>Department</label>
            <select ng-model="data.department">
              <option value="" disabled selected>Select Your Department</option>
              <option ng-repeat="d in departments" value="{{d}}">{{d}}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" ng-model="data.email" placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" ng-model="data.password" placeholder="Create password" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" ng-model="data.confirmPassword" placeholder="Re-enter password" />
          </div>
          <div class="checkbox-row">
            <input type="checkbox" ng-model="agree" id="terms" />
            <label for="terms">I agree to the <a href="#">terms &amp; conditions</a></label>
          </div>
          <button type="submit" class="btn-primary">Register</button>
        </form>

        <div class="switch-link">Already have an account? <a href="login.html">Login here</a></div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/volunteer-controllers.js"></script>
</body>
</html>
