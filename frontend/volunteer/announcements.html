<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteer | Announcements</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body ng-controller="VolAnnouncementsCtrl" ng-init="activePage='announcements'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="content-area">
        <h1>Announcements</h1>
        <p class="subtitle" style="margin-bottom:20px;">Latest updates from the organizing team</p>

        <div class="announcement-card" ng-repeat="a in announcements">
          <h4>{{a.title}}</h4>
          <div>{{a.message}}</div>
          <div class="ann-date">{{a.createdAt | date:'dd.MM.yyyy'}}</div>
        </div>

        <div class="empty-state" ng-if="!announcements.length">No announcements yet.</div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/volunteer-controllers.js"></script>
</body>
</html>
