<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteer | My Profile</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body ng-controller="VolProfileCtrl" ng-init="activePage='profile'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="content-area">
        <h1>My Profile</h1>
        <p class="subtitle" style="margin-bottom:20px;">View and update your information</p>

        <div class="panel">
          <div class="profile-block">
            <!-- TODO: replace with an actual photo at ../assets/avatar.png -->
            <div class="avatar-circle"></div>
            <div class="profile-info" ng-if="!editing">
              <div><span class="info-label">Full Name</span><br />{{profile.fullName}}</div>
              <div><span class="info-label">Register No.</span><br />{{profile.registerNo}}</div>
              <div><span class="info-label">Department</span><br />{{profile.department}}</div>
              <div><span class="info-label">Email</span><br />{{profile.email}}</div>
              <div><span class="info-label">Phone No.</span><br />{{profile.phone || 'Not set'}}</div>
            </div>

            <form ng-if="editing" ng-submit="saveProfile()" class="profile-info">
              <div class="form-group"><label>Full Name</label><input type="text" ng-model="profile.fullName" /></div>
              <div class="form-group"><label>Department</label><input type="text" ng-model="profile.department" /></div>
              <div class="form-group"><label>Phone No.</label><input type="text" ng-model="profile.phone" /></div>
              <button type="submit" class="btn-primary" style="width:auto; padding:9px 22px;">Save</button>
            </form>
          </div>

          <button class="btn-secondary" ng-if="!editing" ng-click="startEdit()">Edit Profile</button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/volunteer-controllers.js"></script>
</body>
</html>
