<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteers | Admin Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body class="green-page" ng-controller="AdminDashboardCtrl" ng-init="activePage='dashboard'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Admin Dashboard</h1>
          <div class="subtitle">Overview of fest volunteer</div>
        </div>
        <div class="admin-chip">👤 Admin ▾</div>
      </div>

      <div class="content-area">
        <div class="stat-cards">
          <div class="stat-card" style="background:#dcead9;">
            <div class="num">{{stats.totalVolunteers || 0}}</div>
            <div class="label">Total volunteer</div>
          </div>
          <div class="stat-card" style="background:#dcead9;">
            <div class="num">{{stats.rolesAllocated || 0}}</div>
            <div class="label">Roles Allocated</div>
          </div>
          <div class="stat-card" style="background:#a9c6a4;">
            <div class="num">{{stats.teams || 0}}</div>
            <div class="label">Teams</div>
          </div>
          <div class="stat-card" style="background:#dcead9;">
            <div class="num">{{stats.announcements || 0}}</div>
            <div class="label">Announcement</div>
          </div>
        </div>

        <div class="two-col">
          <div class="panel">
            <h3>Recent Activities</h3>
            <div class="list-row" ng-repeat="r in recentActivities">
              <div class="row-title">{{r.text}}</div>
              <div class="row-date">{{r.date}}</div>
            </div>
          </div>

          <div class="panel quick-actions">
            <h3>Quick actions</h3>
            <button onclick="window.location.href='opportunities.html'">Add opportunity</button>
            <button onclick="window.location.href='announcements.html'">Send announcement</button>
            <button onclick="window.location.href='reports.html'">View report</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-controllers.js"></script>
</body>
</html>
