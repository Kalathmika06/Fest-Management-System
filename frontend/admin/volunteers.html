<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteers | All Volunteers</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body class="green-page" ng-controller="AdminVolunteersCtrl" ng-init="activePage='volunteers'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>All Volunteers</h1>
          <div class="subtitle">View and manage all volunteers</div>
        </div>
        <div class="admin-chip">👤 Admin ▾</div>
      </div>

      <div class="content-area">
        <div class="panel">
          <div class="search-bar-row">
            <input type="text" ng-model="search" placeholder="Search Volunteers..." />
            <select><option>Filters</option></select>
          </div>

          <table class="data-table">
            <thead>
              <tr><th>Name</th><th>Register Number</th><th>Department</th><th>Status</th><th>Role</th></tr>
            </thead>
            <tbody>
              <tr ng-repeat="v in volunteers | filter:search" ng-click="openVolunteer(v)">
                <td>{{v.fullName}}</td>
                <td>{{v.registerNo}}</td>
                <td>{{v.department}}</td>
                <td><span ng-class="v.status === 'Active' ? 'badge-active' : 'badge-inactive'">{{v.status}}</span></td>
                <td>{{v.role === 'volunteer' ? 'Allocate Role' : v.role}}</td>
              </tr>
            </tbody>
          </table>

          <div class="empty-state" ng-if="!volunteers.length">No volunteers registered yet.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-controllers.js"></script>
</body>
</html>
