<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteers | Announcements</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body class="green-page" ng-controller="AdminAnnouncementsCtrl" ng-init="activePage='announcements'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Announcements</h1>
          <div class="subtitle">Create and manage announcements</div>
        </div>
        <div class="admin-chip">👤 Admin ▾</div>
      </div>

      <div class="content-area">
        <div style="text-align:right; margin-bottom:16px;">
          <button class="btn-new" ng-click="showForm = !showForm">+ New Announcements</button>
        </div>

        <div class="panel" ng-if="showForm">
          <form ng-submit="addAnnouncement()">
            <div class="form-group"><label>Title</label><input type="text" ng-model="newAnn.title" required /></div>
            <div class="form-group"><label>Message</label><input type="text" ng-model="newAnn.message" required /></div>
            <button type="submit" class="btn-primary green" style="width:auto; padding:10px 22px;">Post Announcement</button>
          </form>
        </div>

        <div class="announcement-card" ng-repeat="a in announcements">
          <h4>{{a.title}}</h4>
          <div>{{a.message}}</div>
          <div class="ann-date">{{a.createdAt | date:'dd.MM.yyyy'}}</div>
          <button class="btn-small reject" style="margin-top:8px;" ng-click="removeAnnouncement(a)">Delete</button>
        </div>

        <div class="empty-state" ng-if="!announcements.length">No announcements yet.</div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-controllers.js"></script>
</body>
</html>
