<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteers | Role Allocation</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body class="green-page" ng-controller="AdminRoleAllocationCtrl" ng-init="activePage='roles'">
  <div class="app-shell">
    <div ng-include="'partials/sidebar.html'"></div>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Role Allocation</h1>
          <div class="subtitle">Assign roles to selected volunteers</div>
        </div>
        <div class="admin-chip">👤 Admin ▾</div>
      </div>

      <div class="content-area">
        <div class="panel form-panel">
          <div class="success-msg" ng-if="successMsg">{{successMsg}}</div>

          <form ng-submit="assign()">
            <div class="form-group">
              <label>Select Volunteer</label>
              <select ng-model="form.volunteer">
                <option value="" disabled selected>Choose a volunteer</option>
                <option ng-repeat="v in volunteers" value="{{v._id}}">{{v.fullName}} [{{v.registerNo}}]</option>
              </select>
            </div>
            <div class="form-group">
              <label>Select Role</label>
              <select ng-model="form.volunteerRole">
                <option ng-repeat="r in roles" value="{{r}}">{{r}}</option>
              </select>
            </div>
            <div class="form-group">
              <label>Team/Area</label>
              <input type="text" ng-model="form.teamArea" placeholder="e.g. Web and app development" />
            </div>
            <div class="form-group">
              <label>Start date</label>
              <input type="date" ng-model="form.startDate" />
            </div>
            <div class="form-group">
              <label>End date</label>
              <input type="date" ng-model="form.endDate" />
            </div>
            <button type="submit" class="btn-primary green" style="width:auto; padding:11px 28px;">Assign Role</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-controllers.js"></script>
</body>
</html>
