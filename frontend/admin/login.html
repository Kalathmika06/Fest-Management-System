<!DOCTYPE html>
<html lang="en" ng-app="festApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fest Volunteers | Admin Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
</head>
<body>
  <div class="auth-wrapper" ng-controller="AdminLoginCtrl">
    <!-- TODO: replace background-color below with background-image: url('../assets/concert-green.jpg') once you add your own photo -->
    <div class="auth-image" style="background:linear-gradient(160deg,#06140b,#173d24);"></div>

    <div class="auth-form-side">
      <div class="auth-box">
        <div class="logo-wrap">
          <!-- TODO: replace with your own college/fest logo at ../assets/logo.png -->
          <div style="font-size:56px;">🏛️</div>
        </div>
        <h2>ADMIN LOGIN</h2>
        <p class="subtitle">Access The Admin Portal</p>

        <div class="error-msg" ng-if="error">{{error}}</div>

        <form ng-submit="submit()">
          <div class="form-group">
            <label>Email</label>
            <input type="email" ng-model="creds.email" />
          </div>
          <div class="form-group pw-field">
            <label>Password</label>
            <input ng-attr-type="{{showPw ? 'text' : 'password'}}" ng-model="creds.password" />
            <button type="button" class="toggle-pw" ng-click="togglePw()">👁</button>
          </div>
          <div class="forgot-link"><a href="#">Forgot password?</a></div>
          <button type="submit" class="btn-primary green">LOGIN</button>
        </form>

        <div class="switch-link" style="margin-top:10px;"><a href="../volunteer/login.html">← Volunteer Login</a></div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-controllers.js"></script>
</body>
</html>
